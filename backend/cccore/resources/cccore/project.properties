# cccore safe defaults. NEVER put keys or tokens here.
# Secrets belong in local.properties (gitignored), environment variables or a Cloud secret under the provider-key prefix.
# ASSUMPTION: values below are starting points for spike S4 (docs/assumptions.md AS-02).

cc.provider.gemini.tier=free
cc.provider.openai.tier=paid
cc.provider.anthropic.tier=paid
# Provider base URLs are intentionally empty until verified in spike S3 (docs/verification-log.md).
cc.provider.gemini.baseUrl=
cc.provider.openai.baseUrl=
cc.provider.anthropic.baseUrl=
cc.http.connectTimeoutMs=3000
cc.http.requestTimeoutMs=8000
cc.http.pool.size=8
cc.stream.timeoutSeconds=30
cc.stream.heartbeatSeconds=10
cc.config.cacheTtlSeconds=30
cc.message.maxLength=1000
cc.sanitiser.enabled=true
