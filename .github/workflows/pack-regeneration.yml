name: pack-regeneration
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and diff
        run: |
          if [ -f tools/packgen/generate.py ]; then python3 tools/packgen/generate.py && git diff --exit-code; else echo "::notice::packgen not created yet (Stage 9)"; fi
